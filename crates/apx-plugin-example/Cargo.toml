[package]
name = "apx-plugin-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Aperture X — Beispiel-Plugin (Phase 9 Schritt 9, siehe PLAN.md): ein winziger Custom-Effekt (Farben invertieren, `param` steuert die Mischstärke), gebaut als `cdylib` für `apx-plugin-host`s Integrationstest. Kein Bestandteil der ausgelieferten App, dient nur als lauffähiger, ehrlicher Beweis, dass der ABI-Vertrag über eine echte Prozessgrenze (dlopen/LoadLibrary) hinweg funktioniert."

[lib]
# `rlib` zusätzlich zu `cdylib`, damit `apx-plugin-host`s Testcode das
# Beispiel-Plugin auch direkt (ohne `dlopen`) importieren und seine
# Effekt-Funktion mit denselben Eingaben wie über die ABI-Grenze
# aufrufen kann — ein zweiter, unabhängiger Vergleichspfad für den Test
# (siehe `apx-plugin-host`s Moduldoku).
crate-type = ["cdylib", "rlib"]

[dependencies]
apx-plugin-abi.workspace = true
