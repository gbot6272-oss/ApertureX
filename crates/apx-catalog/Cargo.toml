[package]
name = "apx-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Aperture X — SQLite-Katalog, Migrationen, typisierte Repositories. Hängt nur von apx-core ab, nicht von apx-raw."

[dependencies]
apx-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true
# Kein "time"-Feature: Zeitspalten sind laut Schema INTEGER (Unix-Sekunden),
# rusqlites eingebaute OffsetDateTime-Konvertierung würde stattdessen TEXT
# (RFC 3339) erwarten. Die Umwandlung passiert daher manuell in models.rs.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
# Nur zum Bauen von Test-EDL-Werten (EdlEnvelope.payload ist für
# apx-catalog selbst undurchsichtig, siehe repository/edits.rs).
serde_json.workspace = true
