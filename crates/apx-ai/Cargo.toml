[package]
name = "apx-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Aperture X — KI-Funktionen (Phase 7, siehe DECISIONS.md ADR-0033): klassische Bildanalyse-Heuristiken (KI-Masken, Reparatur-Analyse, Auto-Tagging) statt echter ONNX-Runtime-Modellinferenz, echter Anthropic-LLM-Client für den Preset-Generator. Hängt von apx-core/apx-raw/apx-pipeline/apx-catalog ab."

[dependencies]
apx-core.workspace = true
apx-raw.workspace = true
apx-pipeline.workspace = true
apx-catalog.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
# Anthropic-Messages-API-Client für den LLM-Preset-Generator (Schritt 4) —
# rustls-tls statt der systemabhängigen OpenSSL-Variante, damit alle drei
# CI-Plattformen ohne zusätzliche Systemabhängigkeiten bauen (dieselbe
# Begründung wie rusqlites "bundled"-Feature in apx-catalog).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt"] }
# ONNX-Laufzeit für echte Modellinferenz (Phase 13, siehe DECISIONS.md
# ADR-0040 — korrigiert ADR-0033 Punkt 1, das eine echte ONNX-Laufzeit
# noch für unerreichbar hielt). `download-binaries` (ort-Standard) holt
# beim Bauen ein vorkompiliertes ONNX-Runtime-Binary von `cdn.pyke.io` —
# funktioniert auf echten CI-Runnern/Nutzerrechnern, wird aber von dieser
# Entwicklungs-Sandbox blockiert (Proxy-403, `cdn.pyke.io` steht nicht auf
# der Freigabeliste dieser Sitzung — kein grundsätzliches Problem, siehe
# `/root/.ccr/README.md`s "403 / 407"-Abschnitt). `load-dynamic` lädt
# stattdessen eine vom Nutzer/System bereitgestellte `.so`/`.dll` zur
# Laufzeit über `ORT_DYLIB_PATH` — funktioniert überall, verlangt aber,
# dass irgendjemand die Laufzeitbibliothek bereitstellt. Für den
# Spike-Test hier ist `load-dynamic` die einzige in dieser Sandbox
# testbare Variante (mit `pip install onnxruntime`s `libonnxruntime.so`
# als Testbibliothek); welche Strategie die ausgelieferte App tatsächlich
# nutzt, entscheidet Schritt 1.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.17"
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }
image.workspace = true
# Echte Personen-Wiedererkennung (Phase 13 Schritt 8, siehe DECISIONS.md
# ADR-0040-Nachtrag VI) — bindet an die Systembibliothek `libdlib`
# (Boost Software License 1.0) über deren `build-native`-Feature, hinter
# dem standardmäßig ausgeschalteten Cargo-Feature `people` (dieselbe
# Konvention wie `apx-tether`s `tethering`-Feature/`gphoto2`, siehe
# THIRD_PARTY.md). Verwendet NICHT die von diesem Crate mitgelieferten
# Modelldateien (`embed-*`-Features) — deren Standard-Landmark-Modell
# (`shape_predictor_68_face_landmarks.dat`) schließt kommerzielle Nutzung
# ausdrücklich aus (Autoren-Hinweis in `davisking/dlib-models`); stattdessen
# lädt der Nutzer selbst zwei nachweislich gemeinfreie Modelldateien herunter
# (`dlib_face_recognition_resnet_model_v1.dat`, `shape_predictor_5_face_landmarks.dat`
# — CC0/Public Domain, siehe `apx-ai::people`s Moduldoku).
dlib-face-recognition = { version = "0.3.2", default-features = false, features = ["build-native"], optional = true }
# Farb-Harmonie-Rad (Phase 14 Schritt 7, siehe `apx_ai::palette`s
# Moduldoku) — real per `cargo add --dry-run` geprüft, v0.7.1, MIT/
# Apache-2.0. `default-features = false` spart die CLI-Abhängigkeiten
# (`app`/`structopt`/das `image`-Feature — dieses Projekt dekodiert
# Bilder bereits selbst über die eigene `image`-Abhängigkeit), nur
# `palette_color` (Trait-Implementierungen für `palette::Lab`/`Rgb`).
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
# `kmeans_colors`s `palette_color`-Feature zieht `palette` nur transitiv
# — als direkte Abhängigkeit hier nötig, weil `apx_ai::palette` selbst
# `palette`s Typen (`Lab`/`Lch`/`Srgb`) benennt, nicht nur `kmeans_colors`
# aufruft. Minimalfeatures (`std` allein): keine benannten CSS-Farben
# (`named`), kein `serde`, nichts davon wird gebraucht.
palette = { version = "0.7.7", default-features = false, features = ["std"] }

[features]
# Standardmäßig aus: `libdlib`+`libblas`+`liblapack` fehlen in dieser
# Sandbox und im Standard-CI-Job (derselbe Grund wie `apx-tether`s
# `tethering`-Feature).
people = ["dep:dlib-face-recognition"]

[dev-dependencies]
tempfile = "3"
