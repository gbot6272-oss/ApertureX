[package]
name = "apx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Aperture X — Tauri-Binary. Reine Verdrahtung: Commands, IPC-Events, Protokoll-Handler. Keine Geschäftslogik."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apx-core.workspace = true
apx-raw.workspace = true
apx-catalog.workspace = true
apx-pipeline.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true
walkdir.workspace = true
rayon.workspace = true
image.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7"
# Physische Kernanzahl für die Worker-Pool-Größe beim Thumbnail-Import,
# siehe PHASE1_PROMPT.md Abschnitt 5 ("Parallelität = Anzahl physischer
# Kerne minus 1"). std::thread::available_parallelism() liefert logische
# Kerne, nicht physische — dafür braucht es num_cpus.
num_cpus = "1"
# Dekodiert die von `convertFileSrc` prozentkodierten apx://-Pfadsegmente,
# siehe DECISIONS.md ADR-0009.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
